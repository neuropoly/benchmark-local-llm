# Models switch_model.sh can serve. One per line, fields separated by "|":
#   name | Hugging Face repo | vLLM tool-call parser | extra vLLM arguments | note
# The name is also what clients ask for (no "/", so Claude Code accepts it). For OpenCode, it needs an
# entry in client/opencode.json; Claude Code needs nothing (the launchers ask the server).
# The default (no switch made) is the MODEL in vllm.env.

qwen3.6-27b      | Qwen/Qwen3.6-27B-FP8            | qwen3_coder | --reasoning-parser qwen3 | dense, thinking, ~28 GB, ~45 tok/s per user. Default: best on our ADS tasks
qwen3-coder-next | RedHatAI/Qwen3-Coder-Next-NVFP4 | qwen3_coder |                          | 80B-A3B MoE, ~45 GB, ~150 tok/s per user, a bit weaker on our tasks. Kernels cached on tassan
qwen3.6-35b      | Qwen/Qwen3.6-35B-A3B            | qwen3_coder | --reasoning-parser qwen3 | 35B-A3B MoE, thinking. Not run on tassan yet: first start may compile kernels for a long time

# Not listed on purpose: unsloth/Qwen3-Coder-Next-FP8-Dynamic (~80 GB). It only fits with a lower
# MAX_MODEL_LEN / MAX_NUM_SEQS, and the client launchers assume MAX_MODEL_LEN=131072.
